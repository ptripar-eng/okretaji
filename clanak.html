<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0D2B3E">
<title>Članak | Okretaji</title>
<meta name="description" content="Urednički članak portala Okretaji.">
<link rel="canonical" href="https://okretaji.com/clanak.html">
<style>
:root{--bg:#eaf3f8;--card:#fff;--ink:#0d2b3e;--muted:#4f6979;--line:#d3e2ea;--orange:#f05a1a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:0 22px}.top{padding:18px 0;border-bottom:1px solid var(--line)}.brand{font-weight:900;text-decoration:none;color:var(--ink)}main{padding:35px 0 70px}.kicker{color:var(--orange);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem}h1{font-size:clamp(2.2rem,7vw,4.5rem);line-height:1.02;letter-spacing:-.04em;margin:10px 0 18px}.dek{font-size:1.2rem;color:var(--muted)}.hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin:25px 0;background:#0d2b3e}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin:20px 0}.panel h2{margin-top:0;font-size:1.35rem}.source{font-size:.9rem;color:var(--muted)}a{color:#1c5a86}.notice{font-size:.9rem;color:var(--muted);border-left:3px solid var(--orange);padding-left:14px}
@media(max-width:600px){.wrap{padding:0 16px}.panel{padding:18px}}
</style></head>
<body><header class="top"><div class="wrap"><a class="brand" href="index.html">← OKRETAJI</a></div></header>
<main class="wrap" id="article"><p>Učitavanje članka…</p></main>
<script>
(async()=>{
 const root=document.getElementById("article");
 const params=new URLSearchParams(location.search),url=params.get("u");
 if(!url){root.textContent="Članak nije pronađen.";return}
 try{
  const response=await fetch("news.json?v="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("Vijesti nisu dostupne");
  const data=await response.json(),item=(data.items||[]).find(x=>x.u===url);
  if(!item){root.textContent="Ovaj članak više nije u aktualnoj arhivi. Vratite se na naslovnicu.";return}
  const cats={f1:"Formula 1",motogp:"MotoGP",reli:"Reli",auto:"Automobili",moto:"Motocikli",tech:"Tehnologija",energy:"Energija",kaciga:"Iza kacige"};
  const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n};
  root.innerHTML="";
  root.append(el("div","kicker",cats[item.c]||"Okretaji"),el("h1","",item.t),el("p","dek",item.s));
  root.append(el("p","source",new Date(item.date).toLocaleDateString("hr-HR",{day:"numeric",month:"long",year:"numeric"})+" · "+(item.src||"Izvor")));
  if(item.img&&item.img.src){
   const img=el("img","hero");img.src=item.img.src;img.alt="Ilustrativna fotografija uz članak";img.loading="eager";root.append(img);
   if(item.img.by){const cr=el("p","source","Foto: "+item.img.by+" · "+(item.img.lic||"licenca na izvoru"));root.append(cr)}
  }
  if(item.body&&Array.isArray(item.body)){
   for(const part of item.body){
    const section=el("section","panel");
    if(part.h)section.append(el("h2","",part.h));
    if(part.p)section.append(el("p","",part.p));
    root.append(section);
   }
  } else {
  root.append(el("p","notice","Sažetak vijesti prema navedenom izvornom članku. Za dodatne pojedinosti otvorite izvor."));
  }
  const source=el("section","panel");source.append(el("h2","","Izvor i urednička napomena"));
  const p=el("p","");p.append("Izvorna objava: ");const a=el("a","",item.src||"otvori izvor");a.href=item.u;a.target="_blank";a.rel="noopener noreferrer";p.append(a);source.append(p);
  source.append(el("p","notice",item.body?"Autorski članak Okretaja. Činjenice i izvori navedeni su u tekstu.":"Automatski sažetak izvornog članka; nije autorski tekst Okretaja."));
  root.append(source);
 }catch(e){root.textContent="Članak trenutačno nije moguće učitati. Vratite se na naslovnicu."}
})();
</script></body></html>
