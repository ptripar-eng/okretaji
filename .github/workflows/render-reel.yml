name: Render Okretaji Reels
on:
  workflow_dispatch:
    inputs:
      project:
        description: "JSON projekt iz assets/reels/projects/"
        required: true
        default: "reel-primjer.json"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instaliraj FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Renderiraj video
        run: python scripts/render_reel.py "\${{ inputs.project }}"
      - name: Prenesi MP4 i evidenciju licenci
        uses: actions/upload-artifact@v4
        with:
          name: okretaji-reel
          path: reels/
          if-no-files-found: error
          retention-days: 14
