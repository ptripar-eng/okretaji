name: Browser QA — analytics consent

on:
  push:
    branches: [main]
    paths:
      - 'analytics-consent.js'
      - 'scripts/qa_consent_browser.py'
      - '.github/workflows/consent-browser-check.yml'
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check privacy-preserving GA4 consent behavior
        run: python scripts/qa_consent_browser.py
