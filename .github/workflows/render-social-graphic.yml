name: Render social graphics
on:
  push:
    paths:
      - 'images/*.svg'
      - '.github/workflows/render-social-graphic.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - run: python -c "import cairosvg; cairosvg.svg2png(url='images/kimi-antonelli-prvak-2026.svg', write_to='images/kimi-antonelli-prvak-2026.png', output_width=1080, output_height=1080)"
      - name: Convert PNG to JPEG
        run: python -c "from PIL import Image; im=Image.open('images/kimi-antonelli-prvak-2026.png').convert('RGB'); im.save('images/kimi-antonelli-prvak-2026.jpg', quality=92, optimize=True)"
      - name: Commit social images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/kimi-antonelli-prvak-2026.png images/kimi-antonelli-prvak-2026.jpg
          git diff --cached --quiet || git commit -m "Render Antonelli social graphic as PNG and JPEG"
          git push
