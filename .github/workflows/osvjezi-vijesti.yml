name: Osvježi vijesti

on:
  schedule:
    - cron: "17 */6 * * *"   # svaka 6 sati
  workflow_dispatch:          # ručno pokretanje iz kartice Actions

permissions:
  contents: write

concurrency:
  group: osvjezi-vijesti
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests trafilatura
      - name: Vijesti
        run: python scripts/update_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
      - name: Fotografije
        run: python scripts/add_images.py
        continue-on-error: true
      - name: Najava utrke
        run: python scripts/race_preview.py
        continue-on-error: true
      - name: Spremi promjene
        run: |
          git config user.name "okretaji-bot"
          git config user.email "okretaji-bot@users.noreply.github.com"
          git add news.json
          [ -f images.json ] && git add images.json
          [ -f race.json ] && git add race.json
          git diff --cached --quiet || (git commit -m "Automatsko osvježavanje vijesti" && git pull --rebase && git push)
      - name: Facebook (automatski ako su Meta pristupni podaci postavljeni)
        run: python scripts/post_facebook.py
        env:
          # Objavljuj uživo samo kad su oba Meta secreta postavljena; inače ostani u DRY_RUN.
          DRY_RUN: ${{ secrets.FB_PAGE_ID != '' && secrets.FB_PAGE_TOKEN != '' && '0' || '1' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Instagram (automatski ako su Meta pristupni podaci postavljeni)
        run: python scripts/post_instagram.py
        continue-on-error: true
        env:
          # Potreban je profesionalni Instagram račun povezan s Facebook stranicom.
          IG_DRY_RUN: ${{ secrets.IG_USER_ID != '' && secrets.IG_ACCESS_TOKEN != '' && '0' || '1' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Spremi evidenciju društvenih objava
        if: always() && (hashFiles('posted.json') != '' || hashFiles('instagram_posted.json') != '')
        run: |
          [ -f posted.json ] && git add posted.json || true
          [ -f instagram_posted.json ] && git add instagram_posted.json || true
          git diff --cached --quiet || (git config user.name "okretaji-bot" && git config user.email "okretaji-bot@users.noreply.github.com" && git commit -m "Ažuriraj evidenciju društvenih objava" && git pull --rebase && git push)
