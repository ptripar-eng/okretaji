name: Osvježi vijesti

on:
  schedule:
    - cron: "17 */6 * * *"   # svaka 6 sati
  workflow_dispatch:          # ručno pokretanje iz kartice Actions

permissions:
  contents: write

concurrency:
  group: osvjezi-vijesti
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests trafilatura pillow
      - name: Vijesti
        run: python scripts/update_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
      - name: Fotografije
        run: python scripts/add_images.py
        continue-on-error: true
      - name: Provjera vijesti i jedinstvenosti fotografija
        run: python scripts/check_news.py
      - name: Provjera sintakse Python skripti
        run: python -m py_compile scripts/*.py
      - name: Najava utrke
        run: python scripts/race_preview.py
        continue-on-error: true
      - name: Spremi promjene
        run: |
          git config user.name "okretaji-bot"
          git config user.email "okretaji-bot@users.noreply.github.com"
          git add news.json
          [ -f images.json ] && git add images.json
          [ -f race.json ] && git add race.json
          git diff --cached --quiet || (git commit -m "Automatsko osvježavanje vijesti" && git pull --rebase && git push)
      - name: Fontovi za kartice društvenih mreža
        continue-on-error: true
        run: |
          mkdir -p .fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o .fonts/BigShouldersDisplay.ttf "$base/bigshouldersdisplay/BigShouldersDisplay%5Bwght%5D.ttf"
          curl -fsSL -o .fonts/Barlow-Medium.ttf "$base/barlow/Barlow-Medium.ttf"
          curl -fsSL -o .fonts/Barlow-Bold.ttf "$base/barlow/Barlow-Bold.ttf"
      - name: Facebook (automatski ako su Meta pristupni podaci postavljeni)
        run: python scripts/post_facebook.py
        continue-on-error: true
        env:
          # Objavljuj uživo samo kad su oba Meta secreta postavljena; inače ostani u DRY_RUN.
          DRY_RUN: ${{ secrets.FB_PAGE_ID != '' && secrets.FB_PAGE_TOKEN != '' && '0' || '1' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Instagram (uživo kad je varijabla IG_LIVE = 1)
        run: python scripts/post_instagram.py
        continue-on-error: true
        env:
          # Instagram koristi isti Meta token kao Facebook; IG_USER_ID se dohvaća sa stranice.
          IG_DRY_RUN: ${{ vars.IG_LIVE == '1' && secrets.FB_PAGE_ID != '' && secrets.FB_PAGE_TOKEN != '' && '0' || '1' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Spremi evidenciju društvenih objava
        if: always() && (hashFiles('posted.json') != '' || hashFiles('instagram_posted.json') != '')
        run: |
          [ -f posted.json ] && git add posted.json || true
          [ -f instagram_posted.json ] && git add instagram_posted.json || true
          git diff --cached --quiet || (git config user.name "okretaji-bot" && git config user.email "okretaji-bot@users.noreply.github.com" && git commit -m "Ažuriraj evidenciju društvenih objava" && git pull --rebase && git push)
