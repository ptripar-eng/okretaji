name: Prevedi stranice (EN/DE)

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "i18n/**"
      - "scripts/translate_site.py"
      - "scripts/translate_news.py"
      - "scripts/update_sitemap.py"
      - ".github/workflows/prevedi-stranice.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prevedi-stranice
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Prevedi stranice i spremi prijevode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
        run: |
          git config user.name "okretaji-bot"
          git config user.email "okretaji-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --detach FETCH_HEAD
            python scripts/translate_site.py
            git add en de i18n sitemap.xml -- '*.html'
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Automatski prijevod stranica (EN/DE)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Spremanje nije uspjelo (pokušaj $attempt)."
          done
          exit 1
