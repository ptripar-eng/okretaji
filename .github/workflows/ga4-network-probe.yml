name: On-demand GA4 real network probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consented-ga4-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture actual GA4 page_view delivery after explicit consent
        run: python scripts/qa_ga4_network.py
