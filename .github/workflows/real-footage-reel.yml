name: Render real-footage motorcycle Reel

on:
  push:
    branches: [main]
    paths: ['.github/workflows/real-footage-reel.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real footage montage environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install pillow==11.1.0
      - name: Render original editorial footage montage
        run: python scripts/build_real_footage_reel.py
      - name: Verify produced assets
        run: |
          set -e
          test -s build/deliverables/okretaji_moto_guma_stvarne_snimke_1080x1920.mp4
          test -s build/deliverables/okretaji_moto_guma_naslovnica.jpg
          ffmpeg -v error -i build/deliverables/okretaji_moto_guma_stvarne_snimke_1080x1920.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 build/deliverables/okretaji_moto_guma_stvarne_snimke_1080x1920.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: okretaji-real-footage-reel-review
          path: |
            build/deliverables/okretaji_moto_guma_stvarne_snimke_1080x1920.mp4
            build/deliverables/okretaji_moto_guma_naslovnica.jpg
            build/deliverables/okretaji_stvarni_kadrovi_kontrola.jpg
            build/deliverables/sources_and_qa.json
          retention-days: 30
