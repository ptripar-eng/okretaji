<main class="wrap" id="article"><p>Loading article…</p></main>
<script>
(async()=>{
 const root=document.getElementById("article");
 const params=new URLSearchParams(location.search),url=params.get("u");
 if(!url){root.textContent="Article not found.";return}
 try{
  const response=await fetch("../news_en.json?v="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("Vijesti nisu dostupne");
  const data=await response.json(),item=(data.items||[]).find(x=>x.u===url);
  if(!item){root.textContent="This article is no longer in the current archive. Return to the homepage.";return}
  const cats={f1:"Formula 1",motogp:"MotoGP",reli:"Rally",auto:"Cars",moto:"Motorcycles",tech:"Technology",energy:"Energy",kaciga:"Behind the Helmet"};
  const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n};
  root.innerHTML="";
  root.append(el("div","kicker",cats[item.c]||"Okretaji"),el("h1","",item.t),el("p","dek",item.s));
  root.append(el("p","source",new Date(item.date).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})+" · "+(item.src||"Source")));
  if(item.img&&item.img.src){
   const img=el("img","hero");img.src=item.img.src;img.alt="Illustrative photo accompanying the article";img.loading="eager";root.append(img);
   if(item.img.by){const cr=el("p","source","Photo: "+item.img.by+" · "+(item.img.lic||"license at source"));root.append(cr)}
  }
  if(item.body&&Array.isArray(item.body)){
   for(const part of item.body){
    const section=el("section","panel");
    if(part.h)section.append(el("h2","",part.h));
    if(part.p)section.append(el("p","",part.p));
    root.append(section);
   }
  } else {
  root.append(el("p","notice","News summary based on the cited source article. For additional details, open the source."));
  }
  const source=el("section","panel");source.append(el("h2","","Source and editorial note"));
  const p=el("p","");p.append("Original publication: ");const a=el("a","",item.src||"open source");a.href=item.u;a.target="_blank";a.rel="noopener noreferrer";p.append(a);source.append(p);
  source.append(el("p","notice",item.body?"Original article by Okretaji. Facts and sources are stated in the text.":"Automatic summary of the original article; not an original text by Okretaji."));
  root.append(source);
 }catch(e){root.textContent="The article cannot be loaded at the moment. Return to the homepage."}
})();
</script></body></html>
